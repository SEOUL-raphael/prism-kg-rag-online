[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govrag-portable"
version = "0.1.0"
description = "Docker-free portable RAG harvester for Korean public-sector press releases"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Internal-Pilot"
authors = [{name = "Gov RAG Portable"}]
dependencies = []

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
prism-pdf = ["opendataloader-pdf>=1.8,<2"]
prism-hwp = ["rhwp-python>=0.1.1,<0.2"]
prism = ["opendataloader-pdf>=1.8,<2", "rhwp-python>=0.1.1,<0.2"]
mcp = ["mcp>=1.27,<2; python_version >= '3.10'"]
dev = ["PyMuPDF>=1.24"]

[project.scripts]
govrag = "govrag.cli:main"
prism = "govrag.prism_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
